name: Check and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leselaut-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore incremental TypeScript state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-${{ runner.arch }}-typescript-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-typescript-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build existing target and run all tests
        run: npm test
      - name: Build AWS standalone server
        run: npm run build:aws
      - name: Test AWS standalone server
        run: node scripts/smoke-aws.mjs
      - name: Package checked release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf "$RUNNER_TEMP/release.tgz" -C dist/standalone .
      - name: Save checked release for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aws-release-${{ github.sha }}
          path: ${{ runner.temp }}/release.tgz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Check summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Checks for $GITHUB_SHA — $RESULT. PRs never deploy; main deploys only after this job succeeds." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check-and-deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
    concurrency:
      group: leselaut-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Retrieve this run's checked release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aws-release-${{ github.sha }}
          path: ${{ runner.temp }}/checked-release
      - name: Read deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: aws
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('deploy/aws/deployment.json','utf8'));
          console.log(`role=${config.DeployRoleArn}`);
          console.log(`region=${config.region}`);
          JS
      - name: Authenticate to AWS with short-lived GitHub identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.aws.outputs.role }}
          aws-region: ${{ steps.aws.outputs.region }}
          mask-aws-account-id: true
      - name: Deploy checked commit and verify public health
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          LESELAUT_RELEASE_ARCHIVE: ${{ runner.temp }}/checked-release/release.tgz
        run: node scripts/deploy-aws.mjs
